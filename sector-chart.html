<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>S&P 500 섹터별 퍼포먼스 비교</title>

<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg: #000000;
  --surface: #0a0a0a;
  --surface2: #111111;
  --border: #1a1a1a;
  --border-hover: #2a2a2a;
  --text: #e4e4e7;
  --text-dim: #71717a;
  --text-muted: #52525b;
  --green: #22c55e;
  --red: #ef4444;
  --cyan: #22d3ee;
  --blue: #4a90ff;
  --gold: #ffd644;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Noto Sans KR', -apple-system, sans-serif;
  --radius: 12px;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.container { max-width: 1400px; margin: 0 auto; }

/* ====== HEADER ====== */
.header {
  padding: 36px 20px 24px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}

.header h1 {
  font-size: clamp(22px, 5vw, 36px);
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}

.sub { font-size: 13px; color: var(--text-dim); }
.time { font-family: var(--mono); font-size: 11px; color: var(--text-muted); margin-top: 8px; }

/* ====== SHARE ====== */
.share-bar { display: flex; gap: 6px; justify-content: center; margin: 16px 0 4px; flex-wrap: wrap; }
.share-btn { display: flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-hover); background: var(--surface); color: #a1a1aa; font-size: 11px; cursor: pointer; font-family: var(--sans); transition: all 0.2s; }
.share-btn:hover { border-color: #444; color: var(--text); }
.share-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.share-btn.twitter:hover { border-color: #1d9bf0; color: #1d9bf0; }
.share-btn.kakao:hover { border-color: #fee500; color: #fee500; }
.share-btn.telegram:hover { border-color: #26a5e4; color: #26a5e4; }
.share-btn.instagram:hover { border-color: #e1306c; color: #e1306c; }
.share-btn.instagram.copied { border-color: var(--green); color: var(--green); }
.share-btn.copy:hover { border-color: var(--green); color: var(--green); }
.share-btn.copied { border-color: var(--green); color: var(--green); }

.toast { position: fixed; bottom: 20px; right: 20px; background: var(--green); color: #000; padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; z-index: 9999; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; pointer-events: none; }
.toast.show { opacity: 1; transform: translateY(0); }

/* ====== CONTROLS ====== */
.controls {
  display: flex;
  justify-content: center;
  padding: 16px 20px;
}

.period-buttons {
  display: flex;
  gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 4px;
  border-radius: var(--radius-sm);
}

.period-btn {
  padding: 8px 16px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font: 500 13px var(--sans);
  cursor: pointer;
  border-radius: 6px;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.period-btn:hover { color: var(--text); }
.period-btn.active { background: var(--cyan); color: #000; font-weight: 600; }

/* ====== MAIN CONTENT ====== */
.main-content {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 16px;
  padding: 0 20px 16px;
  max-width: 1400px;
  margin: 0 auto;
}

/* ====== CHART ====== */
.chart-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  height: 500px;
  position: relative;
}

.chart-container::after {
  content: 'Herdvibe.com';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font: 700 28px var(--mono);
  color: rgba(255,255,255,0.04);
  pointer-events: none;
  z-index: 2;
  white-space: nowrap;
}

/* ====== STATS BOX ====== */
.stats-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  max-height: 500px;
  overflow-y: auto;
  scrollbar-width: none;
}

.stats-box::-webkit-scrollbar { display: none; }

.stats-title {
  font: 600 14px var(--sans);
  color: var(--text);
  margin-bottom: 16px;
  text-align: center;
}

.stats-list { list-style: none; }

.stats-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.stats-item:last-child { border-bottom: none; }

.stats-asset { display: flex; align-items: center; gap: 10px; }
.stats-dot { width: 10px; height: 10px; border-radius: 50%; }
.stats-name { font: 500 13px var(--sans); }
.stats-symbol { color: var(--text-muted); font-size: 11px; margin-left: 4px; }

.stats-perf { font: 600 13px var(--mono); }
.stats-perf.positive { color: var(--green); }
.stats-perf.negative { color: var(--red); }

/* ====== LEGEND ====== */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 0 20px 20px;
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  justify-content: center;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  opacity: 1;
  transition: opacity 0.2s;
}

.legend-item.disabled { opacity: 0.3; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.legend-label { font-size: 12px; color: var(--text-dim); }

/* ====== FOOTER ====== */
.footer {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px 40px;
  text-align: center;
  font-size: 10px;
  color: var(--text-muted);
}

/* ====== MOBILE ====== */
@media (max-width: 1024px) {
  .main-content { grid-template-columns: 1fr; }
}

@media (max-width: 768px) {
  .header { padding: 20px 16px 14px; }
  .header h1 { font-size: 22px; }

  .controls { padding: 12px 16px; }
  .period-btn { padding: 8px 12px; font-size: 12px; }

  .main-content { padding: 0 12px 12px; gap: 10px; }
  .chart-container { height: 45vh; min-height: 300px; padding: 14px; }  /* 📱 모바일 차트 높이 ← 여기서 조절 */
  .chart-container::after { font-size: 20px; }
  .stats-box { max-height: 400px; }

  .legend { margin: 0 12px 16px; }
  .share-bar { margin: 12px 0 4px; }
  .footer { padding: 0 16px 30px; }
}
</style>
</head>

let currentPeriod = 'YTD';
let chart = null;
let hiddenAssets = new Set();

function getStartDate(period) {
  const now = new Date();
  switch(period) {
    case '1W': return new Date(now - 7*24*60*60*1000);
    case '1M': return new Date(now - 30*24*60*60*1000);
    case '3M': return new Date(now - 90*24*60*60*1000);
    case '12M': return new Date(now - 365*24*60*60*1000);
    case 'YTD': return new Date(now.getFullYear(), 0, 1);
    default: return new Date(now.getFullYear(), 0, 1);
  }
}

function calculatePercentChange(prices, startDate) {
  const startStr = startDate.toISOString().split('T')[0];
  const filtered = prices.filter(p => p.date >= startStr);
  if (filtered.length === 0) return [];
  const basePrice = filtered[0].price;
  return filtered.map(p => ({ x: p.date, y: ((p.price - basePrice) / basePrice * 100).toFixed(2) }));
}

function updateChart() {
  const startDate = getStartDate(currentPeriod);
  const datasets = [];

  Object.entries(ASSETS_DATA).forEach(([symbol, data]) => {
    if (hiddenAssets.has(symbol)) return;
    const percentData = calculatePercentChange(data.prices, startDate);
    if (percentData.length > 0) {
      datasets.push({
        label: symbol,
        data: percentData,
        borderColor: data.color,
        backgroundColor: data.color + '20',
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 4,
        tension: 0.1,
        fill: false
      });
    }
  });

  if (chart) {
    chart.data.datasets = datasets;
    chart.update('none');
  } else {
    const ctx = document.getElementById('perfChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: { datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { right: 80 } },
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#18181b',
            titleColor: '#fff',
            bodyColor: '#a1a1aa',
            borderColor: '#2a2a2a',
            borderWidth: 1,
            padding: 12,
            titleFont: { family: 'Noto Sans KR' },
            bodyFont: { family: 'JetBrains Mono', size: 11 },
            callbacks: {
              label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y >= 0 ? '+' : ''}${ctx.parsed.y}%`
            }
          }
        },
        scales: {
          x: {
            type: 'time',
            time: {
              unit: currentPeriod === '1W' ? 'day' : currentPeriod === '1M' ? 'week' : 'month',
              displayFormats: { day: 'MM/dd', week: 'MM/dd', month: 'yy/MM' }
            },
            grid: { color: '#1a1a1a' },
            ticks: { color: '#52525b', font: { family: 'JetBrains Mono', size: 10 } }
          },
          y: {
            grid: { color: '#1a1a1a' },
            ticks: {
              color: '#52525b',
              font: { family: 'JetBrains Mono', size: 10 },
              callback: (v) => v + '%'
            }
          }
        }
      },
      plugins: [{
        id: 'endLabels',
        afterDraw: (chart) => {
          const ctx = chart.ctx;
          const chartArea = chart.chartArea;
          const endpoints = [];

          chart.data.datasets.forEach((dataset, i) => {
            const meta = chart.getDatasetMeta(i);
            if (meta.hidden) return;
            const lastPoint = meta.data[meta.data.length - 1];
            if (!lastPoint) return;
            const value = parseFloat(dataset.data[dataset.data.length - 1].y);
            endpoints.push({ y: lastPoint.y, value, label: dataset.label, color: dataset.borderColor });
          });

          endpoints.sort((a, b) => a.y - b.y);
          const minGap = 16;
          for (let i = 1; i < endpoints.length; i++) {
            if (endpoints[i].y - endpoints[i-1].y < minGap) endpoints[i].y = endpoints[i-1].y + minGap;
          }

          ctx.save();
          endpoints.forEach(ep => {
            const sign = ep.value >= 0 ? '+' : '';
            ctx.font = 'bold 10px JetBrains Mono, monospace';
            ctx.fillStyle = ep.color;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(`${ep.label} ${sign}${ep.value.toFixed(1)}%`, chartArea.right + 6, ep.y);
          });
          ctx.restore();
        }
      }]
    });
  }
}

function updateStats() {
  const list = document.getElementById('stats-list');
  document.getElementById('period-label').textContent = currentPeriod;

  const sorted = Object.entries(ASSETS_DATA)
    .map(([symbol, data]) => ({ symbol, name: data.name, color: data.color, perf: data.performance[currentPeriod] }))
    .filter(a => a.perf !== null)
    .sort((a, b) => b.perf - a.perf);

  list.innerHTML = sorted.map(asset => {
    const perfClass = asset.perf >= 0 ? 'positive' : 'negative';
    const perfSign = asset.perf >= 0 ? '+' : '';
    const opacity = hiddenAssets.has(asset.symbol) ? '0.3' : '1';
    return `<li class="stats-item" style="opacity:${opacity}">
      <div class="stats-asset">
        <div class="stats-dot" style="background:${asset.color}"></div>
        <span class="stats-name">${asset.symbol} <span class="stats-symbol">(${asset.name})</span></span>
      </div>
      <span class="stats-perf ${perfClass}">${perfSign}${asset.perf}%</span>
    </li>`;
  }).join('');
}

function createLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = Object.entries(ASSETS_DATA).map(([symbol, data]) =>
    `<div class="legend-item" data-symbol="${symbol}">
      <div class="legend-dot" style="background:${data.color}"></div>
      <span class="legend-label">${data.name} (${symbol})</span>
    </div>`
  ).join('');

  legend.querySelectorAll('.legend-item').forEach(item => {
    item.addEventListener('click', () => {
      const symbol = item.dataset.symbol;
      if (hiddenAssets.has(symbol)) { hiddenAssets.delete(symbol); item.classList.remove('disabled'); }
      else { hiddenAssets.add(symbol); item.classList.add('disabled'); }
      updateChart();
      updateStats();
    });
  });
}

document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.period;
    updateChart();
    updateStats();
  });
});

createLegend();
updateChart();
updateStats();
</script>
